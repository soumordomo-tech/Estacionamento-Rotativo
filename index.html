<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leitor de Placas - Estacionamento Rotativo</title>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:0; }
    header { background:#222; padding:16px; text-align:center; }
    h1 { margin:0; font-size:20px; }
    main { max-width:900px; margin:20px auto; padding:20px; background:#1c1c1c; border-radius:8px; }
    .preview { width:100%; aspect-ratio:16/9; background:#333; display:flex; align-items:center; justify-content:center; border-radius:8px; overflow:hidden; }
    .preview img { width:100%; height:100%; object-fit:contain; }
    input, button { margin-top:12px; padding:10px; border-radius:6px; border:none; }
    input[type="file"] { background:#444; color:#eee; }
    button { background:#4e79ff; color:#fff; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .result { margin-top:20px; padding:12px; background:#222; border-radius:6px; }
    .ok { color:#4caf50; }
    .err { color:#f44336; }
    .warn { color:#ff9800; }
    canvas { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>📷 Leitor de Placas (OCR + Correção)</h1>
    <p>Carregue uma foto da placa e clique em "Ler placa".</p>
  </header>

  <main>
    <div class="preview" id="preview"><span>Pré-visualização</span></div>
    <input type="file" id="file" accept="image/*" />
    <button id="btnRead" disabled>Ler placa</button>
    <div class="result" id="result">⏳ Aguardando leitura...</div>
    <canvas id="canvas"></canvas>
  </main>

  <script>
    const REGEX_ANTIGA = /^[A-Z]{3}[0-9]{4}$/;
    const REGEX_MERCOSUL = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;

    const fileInput = document.getElementById('file');
    const btnRead = document.getElementById('btnRead');
    const preview = document.getElementById('preview');
    const resultEl = document.getElementById('result');
    const canvas = document.getElementById('canvas');
    let currentImage = null;

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        preview.innerHTML = '';
        preview.appendChild(img);
        btnRead.disabled = false;
        resultEl.textContent = "✅ Imagem carregada. Clique em 'Ler placa'.";
      };
      img.src = url;
    });

    btnRead.addEventListener('click', async () => {
      if (!currentImage) return;
      btnRead.disabled = true;
      resultEl.textContent = "🔍 Processando imagem...";

      const cvs = preprocessToCanvas(currentImage);
      try {
        const { data: ocr } = await Tesseract.recognize(cvs, 'eng', {
          tessedit_pageseg_mode: '7',
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
        });

        const raw = (ocr.text || '').toUpperCase();
        const cleaned = raw.replace(/[^A-Z0-9]/g, '');
        const { best, candidates } = normalizeAndValidate(cleaned);

        if (best) {
          resultEl.innerHTML = `✅ Placa detectada: <b class="ok">${best}</b>`;
        } else {
          resultEl.innerHTML = `❌ Falha na leitura.<br>OCR bruto: "${raw.trim()}"<br>Sugestões: ${candidates.join(', ')}`;
        }
      } catch (err) {
        resultEl.innerHTML = `❌ Erro no OCR: ${err.message}`;
      } finally {
        btnRead.disabled = false;
      }
    });

    function preprocessToCanvas(img) {
      const MAX_W = 1600;
      const scale = Math.min(1, MAX_W / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const l = 0.2126*d[i] + 0.7152*d[i+1] + 0
